# Injected by the Maestro Selenium worker (frameworks/selenium_java.py :: _ensure_support_files).
# Merged into a project's existing junit-platform.properties, never clobbering other keys.
#
# Autodetection is what lets support/MaestroRecorderExtension apply to EVERY test — video, the
# WebDriver event stream and failure screenshots — without an @ExtendWith annotation on any
# authored test class, so it works on suites written before it existed.
junit.jupiter.extensions.autodetection.enabled=true
